spring:
  application:
    name: site-ready

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ssvdms}
    username: ${SPRING_DATASOURCE_USERNAME:ssvuser}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate   # Liquibase manages schema; Hibernate only validates
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 55MB

server:
  port: 8080
  servlet:
    context-path: /api

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

# App-specific config
app:
  jwt:
    secret: ${JWT_SECRET:S27Dq7XiSMWkQgjlBNiuBt1lI2chlhkklugAweVwWik}
    expiry-ms: ${JWT_EXPIRY_MS:86400000}

  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:ssvadmin}
    secret-key: ${MINIO_SECRET_KEY:password}
    bucket: ${MINIO_BUCKET:ssv-reports}

  signing:
    keystore-path: ${SIGNING_KEYSTORE_PATH:./keystore/ssv-signing.p12}
    keystore-password: ${SIGNING_KEYSTORE_PASSWORD:password}
    alias: ssv-pdf-signer

  base-url: ${APP_BASE_URL:http://localhost:4200}

logging:
  level:
    com.ssv.dms: DEBUG
    org.springframework.security: INFO
