<div class="flex h-screen overflow-hidden bg-base-100">

  <!-- Sidebar -->
  <aside
    class="flex flex-col w-60 bg-base-200 border-r border-base-300 shrink-0"
    [class.hidden]="!sidebarOpen()"
  >
    <!-- Logo -->
    <div class="flex items-center gap-3 px-5 py-5 border-b border-base-300">
      <div class="w-7 h-7 rounded-lg bg-secondary flex items-center justify-center">
        <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414A1 1 0 0119 9.414V19a2 2 0 01-2 2z"/>
        </svg>
      </div>
      <div>
        <p class="text-sm font-bold leading-tight">SSV DMS</p>
        <p class="text-xs text-base-content/60">Document Management</p>
      </div>
    </div>

    <!-- Nav -->
    <nav class="flex-1 overflow-y-auto p-3 space-y-1">

      <a routerLink="/dashboard" routerLinkActive="active" class="nav-link">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
        </svg>
        Dashboard
      </a>

      @if (isVendor()) {
        <a routerLink="/upload" routerLinkActive="active" class="nav-link">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/>
          </svg>
          Upload Report
        </a>
      }

      @if (isEngineer() || isAdmin()) {
        <a routerLink="/review" routerLinkActive="active" class="nav-link">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/>
          </svg>
          Review Queue
        </a>
      }

      <a routerLink="/search" routerLinkActive="active" class="nav-link">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
        </svg>
        Search & Export
      </a>

      @if (isAdmin()) {
        <div class="divider text-xs text-base-content/40 my-1">Admin</div>
        <a routerLink="/admin" routerLinkActive="active" class="nav-link">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/>
          </svg>
          User Management
        </a>
      }
    </nav>

    <!-- User footer -->
    <div class="p-3 border-t border-base-300">
      <div class="flex items-center gap-3 px-2 py-2 rounded-lg hover:bg-base-300 transition-colors">
        <div class="avatar placeholder">
          <div class="bg-primary text-primary-content rounded-full w-8 h-8">
            <span class="text-xs font-bold">{{ initials() }}</span>
          </div>
        </div>
        <div class="flex-1 min-w-0">
          <p class="text-sm font-medium truncate">{{ user()?.fullName }}</p>
          <p class="text-xs text-base-content/60 truncate">{{ roleBadge() }}</p>
        </div>
      </div>
      <div class="flex gap-1 mt-2">
        <a routerLink="/profile" class="btn btn-ghost btn-xs flex-1">Profile</a>
        <button (click)="auth.logout()" class="btn btn-ghost btn-xs flex-1 text-error">Logout</button>
      </div>
    </div>
  </aside>

  <!-- Main content -->
  <div class="flex-1 flex flex-col overflow-hidden">
    <!-- Top bar (mobile) -->
    <header class="flex items-center gap-3 px-4 py-3 bg-base-100 border-b border-base-300 lg:hidden">
      <button class="btn btn-ghost btn-sm btn-square" (click)="toggleSidebar()">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
      </button>
      <span class="font-bold">SSV DMS</span>
    </header>

    <main class="flex-1 overflow-y-auto p-6">
      <div class="page-enter">
        <router-outlet />
      </div>
    </main>
  </div>
</div>
