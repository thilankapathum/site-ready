<div class="min-h-screen bg-base-200 flex items-center justify-center p-4">
  <div class="w-full max-w-md">

    <!-- Logo + heading -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-primary mb-4 shadow-lg">
        <svg class="w-8 h-8 text-primary-content" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414A1 1 0 0119 9.414V19a2 2 0 01-2 2z"/>
        </svg>
      </div>
      <h1 class="text-2xl font-bold">SSV Document Management</h1>
      <p class="text-base-content/60 text-sm mt-1">Sign in to your account</p>
    </div>

    <!-- Card -->
    <div class="card bg-base-100 shadow-xl border border-base-300">
      <div class="card-body gap-4">

        @if (error()) {
          <div class="alert alert-error text-sm py-2">
            <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
            {{ error() }}
          </div>
        }

        <div class="form-control">
          <label class="label"><span class="label-text font-medium">Email address</span></label>
          <input
            type="email"
            class="input input-bordered"
            placeholder="you@company.com"
            [(ngModel)]="email"
            (keydown.enter)="login()"
            autocomplete="email"
          />
        </div>

        <div class="form-control">
          <label class="label">
            <span class="label-text font-medium">Password</span>
          </label>
          <input
            [type]="showPassword() ? 'text' : 'password'"
            class="input input-bordered"
            placeholder="••••••••"
            [(ngModel)]="password"
            (keydown.enter)="login()"
            autocomplete="current-password"
          />
          <label class="label cursor-pointer justify-start gap-2 pt-1">
            <input type="checkbox" class="checkbox checkbox-xs"
                   [checked]="showPassword()"
                   (change)="showPassword.set(!showPassword())" />
            <span class="label-text text-xs">Show password</span>
          </label>
        </div>

        <button
          class="btn btn-primary w-full mt-2"
          (click)="login()"
          [disabled]="loading()"
        >
          @if (loading()) {
            <span class="loading loading-spinner loading-sm"></span>
          }
          Sign In
        </button>

        <div class="divider text-xs text-base-content/40">Don't have an account?</div>

        <a routerLink="/register" class="btn btn-outline w-full btn-sm">
          Create account
        </a>
      </div>
    </div>

    <p class="text-center text-xs text-base-content/40 mt-6">
      New accounts require admin activation before first login.
    </p>
  </div>
</div>
