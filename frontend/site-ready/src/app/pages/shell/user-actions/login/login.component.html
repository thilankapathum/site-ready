<div class="min-h-screen bg-base-200 flex items-center justify-center p-4">
  <div class="w-full max-w-md">

    <!-- Logo + heading -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl mb-4 ">
        <svg class="text-secondary" width="40" height="40" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M9 15H15M9 12H15M3 6V16.8C3 17.9201 3 18.4796 3.21799 18.9074C3.40973 19.2837 3.71547 19.5905 4.0918 19.7822C4.5192 20 5.07899 20 6.19691 20H17.8037C18.9216 20 19.4806 20 19.908 19.7822C20.2843 19.5905 20.5905 19.2841 20.7822 18.9078C21.0002 18.48 21.0002 17.9199 21.0002 16.7998L21.0002 9.19978C21.0002 8.07967 21.0002 7.51962 20.7822 7.0918C20.5905 6.71547 20.2837 6.40973 19.9074 6.21799C19.4796 6 18.9201 6 17.8 6H12M3 6H12M3 6C3 4.89543 3.89543 4 5 4H8.67452C9.1637 4 9.40915 4 9.63933 4.05526C9.8434 4.10425 10.0379 4.18526 10.2168 4.29492C10.4186 4.41856 10.5918 4.59183 10.9375 4.9375L12 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>

      </div>
      <h1 class="text-2xl font-bold text-secondary">SLTMobitel <span class="text-base-content/10 font-thin">|</span> <span class="title-font font-normal text-accent"> SiteReady</span></h1>
      <h1 class="text-xl text-neutral">SSV Document Management System</h1>
      <p class="text-base-content/60 text-sm mt-1">Sign in to your account</p>
    </div>

    <!-- Card -->
    <div class="card bg-base-100 shadow-xl border border-base-300">
      <div class="card-body gap-4">

        @if (error()) {
          <div class="alert alert-error text-sm py-2">
            <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
            {{ error() }}
          </div>
        }

        <div class="form-control">
          <label class="label"><span class="label-text font-medium">Email address</span></label>
          <input
            type="email"
            class="input input-bordered"
            placeholder="you@company.com"
            [(ngModel)]="email"
            (keydown.enter)="login()"
            autocomplete="email"
          />
        </div>

        <div class="form-control">
          <label class="label">
            <span class="label-text font-medium">Password</span>
          </label>
          <input
            [type]="showPassword() ? 'text' : 'password'"
            class="input input-bordered"
            placeholder="••••••••"
            [(ngModel)]="password"
            (keydown.enter)="login()"
            autocomplete="current-password"
          />
          <label class="label cursor-pointer justify-start gap-2 pt-1">
            <input type="checkbox" class="checkbox checkbox-xs"
                   [checked]="showPassword()"
                   (change)="showPassword.set(!showPassword())" />
            <span class="label-text text-xs">Show password</span>
          </label>
        </div>

        <button
          class="btn btn-primary w-full mt-2"
          (click)="login()"
          [disabled]="loading()"
        >
          @if (loading()) {
            <span class="loading loading-spinner loading-sm"></span>
          }
          Sign In
        </button>

        <div class="divider text-xs text-base-content/40">Don't have an account?</div>

        <a routerLink="/register" class="btn btn-outline w-full btn-sm">
          Create account
        </a>
      </div>
    </div>

    <p class="text-center text-xs text-base-content/40 mt-6">
      New accounts require admin activation before first login.
    </p>
  </div>
</div>
